# Learning template only. Never commit a real secret file.
# DATABASE_URL passwords must be URL encoded when they contain reserved characters.
apiVersion: v1
kind: Secret
metadata:
  name: tarzan-secrets
  namespace: tarzan
  labels:
    app.kubernetes.io/part-of: tarzan
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_WITH_A_STRONG_DATABASE_PASSWORD
  DATABASE_URL: postgresql://tarzan:REPLACE_WITH_URL_ENCODED_PASSWORD@postgres:5432/tarzan?schema=public
  JWT_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
