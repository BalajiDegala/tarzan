# Copy this file to the separate GitOps repository at:
# environments/production/tarzan-values.yaml

config:
  webOrigin: https://tarzan.example.com
  cookieSecure: 'true'

secret:
  create: false
  existingSecret: tarzan-secrets

imagePullSecrets:
  - name: harbor-registry

api:
  replicaCount: 2
  image:
    repository: harbor.example.com/tarzan/tarzan-api
    tag: REPLACE_WITH_FIRST_IMAGE_TAG

web:
  replicaCount: 2
  image:
    repository: harbor.example.com/tarzan/tarzan-web
    tag: REPLACE_WITH_FIRST_IMAGE_TAG

postgres:
  persistence:
    storageClassName: REPLACE_WITH_CSI_STORAGE_CLASS
    size: 20Gi
    static:
      enabled: false

ingress:
  enabled: true
  className: nginx
  host: tarzan.example.com
  tls:
    enabled: true
    secretName: tarzan-tls
