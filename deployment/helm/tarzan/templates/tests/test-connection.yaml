apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "tarzan.fullname" . }}-test-connection"
  labels:
    {{- include "tarzan.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - wget
      args:
        - --quiet
        - --tries=1
        - --spider
        - "http://{{ .Values.web.service.name }}:{{ .Values.web.service.port }}/api/health"
