name: tarzan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tarzan}
      POSTGRES_USER: ${POSTGRES_USER:-tarzan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tarzan_local_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - tarzan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tarzan}:${POSTGRES_PASSWORD:-tarzan_local_password}@db:5432/${POSTGRES_DB:-tarzan}?schema=public
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      JWT_SECRET: ${JWT_SECRET:-tarzan_local_only_change_me_32_chars_minimum}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/api/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tarzan_postgres_data:
